apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: nginx-webserver02
  catalog: infrastructure
  labels:
    category: web
spec:
  type: container
  displayName: Nginx Web Server GitOps
  shortDescription: Lightweight high-performance web server GitOps
  # 1. artifactsで「何を使うか」を定義
  artifacts:
    - type: container
      name: nginx-image  # このアーティファクトに名前を付ける
      uri: docker.io/library/nginx:1.27.0-alpine
  # 2. versionsで「どのアーティファクトのどのタグを使うか」を紐付け
  versions:
    - version: "1.27.0"
      references:
        - name: nginx-image  # 上記のartifacts.nameと一致させる
      channels:
        - stable
