apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: ubi10-simple-quadlet
  catalog: infrastructure
  labels:
    category: demo
    demo: "true"
    runtime: podman
    os: rhel10

spec:
  # 1. 実行形式はユーザー指定通り "quadlet" を維持
  # これにより、デバイス上では Podman Quadlet としてデプロイされます
  type: quadlet

  displayName: UBI 10 Simple Quadlet App

  shortDescription: >
    A simple RHEL 10 / UBI 10 based Quadlet application 
    for Red Hat Edge Manager fleet management 
    demonstrations.

  artifacts:
    - # 2. アーティファクトの「格納形式」としての指定
      # Edge Managerのバリデーターは、OCIレジストリからの取得には "container" を期待します
      type: container
      uri: quay.io/tmorisu/simple-quadret

  versions:
    - version: "1.0.0"
      references:
        # 3. artifacts.type (container) で定義したキー名を使用してタグを指定
        container: "ubi10-v1"
      channels:
        - stable
