apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: ubi10-simple-quadlet
  catalog: infrastructure
  labels:
    demo: "true"
    runtime: podman
    os: rhel10
spec:
  # 1. 実行形式の指定: device-quadlet-app.yaml の "type: quadlet" に相当
  # これにより、デバイス側で Quadlet として展開されます
  type: quadlet

  displayName: UBI 10 Simple Quadlet App
  shortDescription: >
    A declarative Quadlet deployment demo using UBI 10 
    for Edge Manager environment.

  artifacts:
    - # 2. 格納形式の指定: カタログのバリデーション上、OCIイメージは "container" と書きます
      type: container
      uri: quay.io/tmorisu/simple-quadret

  versions:
    - version: "1.0.1"
      references:
        # 3. artifacts で定義した type (container) とキーを一致させます
        container: "ubi10-v1"
      channels:
        - stable
