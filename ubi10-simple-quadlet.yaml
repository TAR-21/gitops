apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: ubi10-simple-quadlet
  catalog: infrastructure
  labels:
    demo: "true"
    runtime: podman
    os: rhel10
spec:
  # 1. デバイス上でどう動かすか（実行形式）
  # 以前のエラーはこの spec.type ではなく artifacts 側の設定が原因でした。
  type: quadlet

  displayName: UBI 10 Simple Quadlet App
  shortDescription: >
    A declarative Quadlet deployment demo using UBI 10 
    for Edge Manager environment.

  artifacts:
    - # 2. どこから取得するか（格納形式）
      # OCIレジストリ(Quay等)から取得する場合は必ず "container" です。
      type: container
      uri: quay.io/tmorisu/simple-quadret

  versions:
    - version: "1.0.0"
      references:
        # 3. artifacts.type (container) で定義したキーを使用してタグを指定
        container: "ubi10-v1"
      channels:
        - stable
